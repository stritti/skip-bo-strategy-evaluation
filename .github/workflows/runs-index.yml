# Regenerates the shared-run index (public/data/runs/index.json,
# src/generated/runsIndex.ts, public/sitemap.xml) on pull requests that add
# run files — e.g. PRs opened by the share-run Netlify function — and commits
# the result back to the PR head branch. Only runs for same-repository PRs
# (GITHUB_TOKEN cannot push to fork branches).
name: Regenerate shared-runs index

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'public/data/runs/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  runs-index:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out PR head branch
        run: git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run runs:index
      - name: Commit regenerated index if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/runs/index.json src/generated/runsIndex.ts public/sitemap.xml
            git commit -m "chore(runs): regenerate runs index (npm run runs:index)"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "index already up to date"
          fi
